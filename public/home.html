<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Software Engineering Interview API</title>
    <style>
      :root {
        --bg: #f6f7fb;
        --card: #ffffff;
        --text: #1b1f3b;
        --muted: #6b7280;
        --border: #e5e7eb;
        --primary: #4f46e5;
        --ok: #16a34a;
        --down: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1020;
          --card: #181a33;
          --text: #eef0ff;
          --muted: #9ca3c7;
          --border: #2a2d52;
          --primary: #818cf8;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(
            circle at 20% 0%,
            color-mix(in srgb, var(--primary) 18%, transparent),
            transparent 45%
          ),
          var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 460px;
        padding: 36px 32px;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: var(--primary);
        color: #fff;
        font-size: 24px;
        font-weight: 700;
      }
      h1 {
        font-size: 22px;
        line-height: 1.3;
      }
      p {
        margin-top: 8px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 22px;
        padding: 8px 14px;
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--muted);
      }
      .status.up .dot {
        background: var(--ok);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 25%, transparent);
      }
      .status.down .dot {
        background: var(--down);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--down) 25%, transparent);
      }
      .links {
        display: flex;
        gap: 10px;
        margin-top: 26px;
      }
      .links a {
        flex: 1;
        padding: 11px 0;
        border-radius: 10px;
        border: 1px solid var(--border);
        color: var(--text);
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.15s, border-color 0.15s;
      }
      .links a.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      .links a:hover {
        transform: translateY(-2px);
        border-color: var(--primary);
      }
      footer {
        margin-top: 24px;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">SE</div>
      <h1>Software Engineering Interview API</h1>
      <p>
        Backend server for timed quizzes, scoring, leaderboards, and progress
        tracking.
      </p>

      <div id="status" class="status">
        <span class="dot"></span><span id="status-text">Checking server…</span>
      </div>

      <div class="links">
        <a class="primary" href="/api/v1/health/db-ping">Health check</a>
      </div>

      <footer>Version 1.0 · Express + PostgreSQL</footer>
    </main>

    <script>
      const box = document.getElementById("status");
      const text = document.getElementById("status-text");
      fetch("/api/v1/health/db-ping")
        .then((res) => (res.ok ? res.json() : Promise.reject()))
        .then((json) => {
          box.classList.add("up");
          text.textContent = `Server running · DB ${json.data.responseTimeMs} ms`;
        })
        .catch(() => {
          box.classList.add("down");
          text.textContent = "Database unreachable";
        });
    </script>
  </body>
</html>
